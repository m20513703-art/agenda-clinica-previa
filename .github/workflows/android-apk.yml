name: Build Agenda Clinica Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'agenda-clinica-app-source.zip'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract app source
        run: unzip -o agenda-clinica-app-source.zip -d .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install app packages
        run: npm install --prefix agenda-clinica-app --no-audit --no-fund
      - name: Generate Android project
        working-directory: agenda-clinica-app
        run: npx expo prebuild --platform android --no-install
      - name: Build APK
        working-directory: agenda-clinica-app/android
        run: ./gradlew assembleDebug
      - name: Verify APK and app bundle
        run: |
          APK=agenda-clinica-app/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | head -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          python3 -c 'import sys,zipfile; z=zipfile.ZipFile(sys.argv[1]); assert "assets/index.android.bundle" in z.namelist(); print("JS bundle found")' "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: agenda-clinica-mm-debug-apk
          path: agenda-clinica-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
