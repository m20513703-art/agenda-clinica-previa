name: Build Agenda Clinica Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'agenda-clinica-app-source.zip'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract app source
        run: unzip -o agenda-clinica-app-source.zip -d .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install app packages
        run: npm install --prefix agenda-clinica-app --no-audit --no-fund
      - name: Generate Android project
        working-directory: agenda-clinica-app
        run: npx expo prebuild --platform android --no-install
      - name: Build release APK
        working-directory: agenda-clinica-app/android
        run: ./gradlew assembleRelease
      - name: Sign and verify standalone APK
        shell: bash
        run: |
          set -euxo pipefail
          APK=agenda-clinica-app/android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          SDK_BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          keytool -genkeypair -v -keystore scratch-agenda-debug.keystore -storepass changeit -keypass changeit -alias agenda -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Agenda Clinica MM, OU=Development, O=MM Sistemas, L=BR, ST=BR, C=BR'
          "$SDK_BUILD_TOOLS/zipalign" -f -v 4 "$APK" agenda-clinica-app.apk
          "$SDK_BUILD_TOOLS/apksigner" sign --ks scratch-agenda-debug.keystore --ks-pass pass:changeit --key-pass pass:changeit --out agenda-clinica-app-signed.apk agenda-clinica-app.apk
          "$SDK_BUILD_TOOLS/apksigner" verify --verbose agenda-clinica-app-signed.apk
          python3 -c 'import sys,zipfile; z=zipfile.ZipFile(sys.argv[1]); names=z.namelist(); print("Relevant bundle entries:", [n for n in names if "bundle" in n.lower() or n.endswith(".hbc")]); assert any("bundle" in n.lower() or n.endswith(".hbc") for n in names), "Missing packaged React Native JS bundle"' agenda-clinica-app-signed.apk
      - uses: actions/upload-artifact@v4
        with:
          name: agenda-clinica-mm-android-apk
          path: agenda-clinica-app-signed.apk
          retention-days: 30
