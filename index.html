<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10110f"><title>Prévia — Agenda Clínica</title>
<style>
:root{--bg:#10110f;--panel:#191b18;--panel2:#22251f;--line:#30342d;--ink:#f7f6f0;--muted:#a1a69a;--orange:#ff914d;--orange-dark:#3a281c;--green:#b7e578;--red:#ff8f86}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:980px;margin:auto;min-height:100vh;padding:20px 22px 92px}.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.brandrow{display:flex;align-items:center;gap:11px}.logo{width:44px;height:44px;border-radius:13px;background:var(--orange);color:#21150c;display:grid;place-items:center;font-weight:950}.brand{font-size:19px;font-weight:850}.sub{font-size:9px;letter-spacing:1.3px;color:#8d9288;margin-top:3px;font-weight:800}.badge{border:1px solid #644328;color:#ffc18f;padding:6px 10px;border-radius:30px;font-size:10px;font-weight:800;letter-spacing:.9px}.warning{display:flex;gap:10px;padding:12px;background:#2b2118;border:1px solid #4b3522;border-radius:12px;color:#dfcbb8;font-size:12px;line-height:1.45;margin-bottom:20px}.warning b{color:#ffd2ad}.title-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px}.overline{color:var(--orange);font-size:10px;font-weight:900;letter-spacing:1.3px}.title{font-size:27px;font-weight:850;letter-spacing:-.8px;margin:4px 0 0}.muted{color:var(--muted);font-size:12px}.btn{border:1px solid #41453d;background:var(--panel2);color:var(--ink);border-radius:10px;padding:10px 13px;font-weight:750;cursor:pointer}.btn:hover{filter:brightness(1.15)}.primary{border-color:var(--orange);background:var(--orange);color:#21150c}.quiet{border-color:transparent;background:transparent;color:var(--orange)}.datebar{display:flex;align-items:center;gap:8px;margin:16px 0}.datebar input{flex:1}.input,select{min-width:0;background:#11130f;color:var(--ink);border:1px solid #3d4239;border-radius:9px;padding:11px 12px;font:inherit}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.stat{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px}.stat small{display:block;font-size:10px;color:#91968b;font-weight:800;letter-spacing:.8px}.stat strong{display:block;font-size:22px;margin-top:5px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0 18px}.toolbar .btn{flex:1;min-width:140px}.section-head{display:flex;justify-content:space-between;align-items:center;margin:18px 0 10px}.section-head h2{font-size:17px;margin:0}.list{display:grid;gap:9px}.appt{display:grid;grid-template-columns:75px 1fr auto;align-items:start;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}.appt-time{color:var(--orange);font-weight:850;font-size:14px}.appt-patient{font-size:14px;font-weight:800}.appt-prof{color:#e5b088;font-size:12px;margin-top:4px}.appt-status{font-size:10px;border-radius:20px;padding:5px 8px;background:#302920;color:#f5b383}.empty{padding:30px 16px;text-align:center;border:1px dashed #41463d;border-radius:14px;color:var(--muted)}.empty strong{display:block;color:var(--ink);margin-bottom:6px}.tabs{display:flex;gap:5px;border-bottom:1px solid var(--line);margin:12px 0 16px}.tab{border:0;background:transparent;color:#92978d;padding:11px 14px;font-weight:800;cursor:pointer;border-bottom:2px solid transparent}.tab.on{color:var(--orange);border-color:var(--orange)}.manage{display:flex;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px;margin:8px 0}.manage small{color:var(--muted);display:block;margin-top:3px}.manage button{color:var(--red);background:transparent;border:0;font-weight:700;cursor:pointer}.modal-back{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:16px;z-index:2}.modal{background:#161814;border:1px solid #3b3e37;border-radius:18px;padding:20px;width:min(600px,100%);max-height:92vh;overflow:auto;box-shadow:0 20px 70px #0009}.modal h2{margin:0 0 6px;font-size:22px}.field{display:grid;gap:6px;margin:13px 0}.field label{font-size:12px;color:#c9cdc3;font-weight:750}.choice-list{display:flex;flex-wrap:wrap;gap:8px}.choice{border:1px solid #373b34;background:var(--panel);color:#bfc2b9;padding:8px 11px;border-radius:30px;cursor:pointer;font-size:12px}.choice.selected{background:var(--orange-dark);border-color:#895027;color:#ffc18f}.actions{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}.actions .btn{flex:1}.grid{overflow:auto;border:1px solid var(--line);border-radius:12px}.slot{display:grid;grid-template-columns:90px repeat(5,minmax(100px,1fr));min-width:650px}.slot>div{padding:10px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);font-size:11px}.slot.head{background:#242720;color:#ffc18f;font-weight:850}.slot .time{color:var(--orange);font-weight:850}.smallnote{font-size:11px;color:#8f958a;line-height:1.5}.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#252820;border:1px solid #4c5146;padding:12px 16px;border-radius:12px;z-index:5;box-shadow:0 10px 35px #0009;max-width:calc(100% - 32px);font-size:13px}.mobile-nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:30px;background:#151713;border-top:1px solid var(--line);padding:10px}.mobile-nav button{border:0;background:transparent;color:#858b80;font-weight:800;padding:7px;cursor:pointer}.mobile-nav button.on{color:var(--orange)}@media(max-width:620px){.app{padding:15px 14px 86px}.title{font-size:23px}.title-row{align-items:center}.cards{gap:7px}.stat{padding:10px}.stat strong{font-size:19px}.stat small{font-size:8px}.appt{grid-template-columns:58px 1fr}.appt-status{grid-column:2;justify-self:start}.tabs{overflow:auto}.tab{padding:10px 8px;white-space:nowrap;font-size:12px}}
</style></head><body><main class="app"><header class="header"><div class="brandrow"><div class="logo">MM</div><div><div class="brand">Agenda Clínica</div><div class="sub">ORGANIZAÇÃO DE ATENDIMENTOS</div></div></div><span class="badge">PRÉVIA INTERATIVA</span></header><div class="warning"><span>ⓘ</span><span><b>Demonstração local.</b> Os dados ficam somente neste navegador e não têm proteção adequada. Use apenas nomes fictícios; não insira dados de pacientes reais nem informações de saúde.</span></div><nav class="tabs"><button class="tab on" data-tab="agenda">Agenda</button><button class="tab" data-tab="patients">Pacientes</button><button class="tab" data-tab="pros">Profissionais</button></nav><section id="view"></section></main><nav class="mobile-nav"><button class="on" data-tab="agenda">▦ Agenda</button><button data-tab="patients">♙ Pacientes</button><button data-tab="pros">✚ Profissionais</button></nav><div id="modal"></div><div id="toastbox"></div>
<script>
const STORE='agenda-clinica-preview-v1';let data={patients:[],pros:[],appointments:[]};try{data={...data,...JSON.parse(localStorage.getItem(STORE)||'{}')}}catch{}let tab='agenda', selectedDate=new Date().toISOString().slice(0,10);const $=s=>document.querySelector(s),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>Math.random().toString(36).slice(2,10);function save(){localStorage.setItem(STORE,JSON.stringify(data));render()}function dateFmt(s){return s.split('-').reverse().join('/')}function toast(t){$('#toastbox').innerHTML=`<div class="toast">${esc(t)}</div>`;setTimeout(()=>$('#toastbox').innerHTML='',3600)}function setTab(v){tab=v;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===v));render()}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
function render(){const el=$('#view');if(tab==='agenda'){const rows=data.appointments.filter(a=>a.date===selectedDate).sort((a,b)=>a.time.localeCompare(b.time));const unique=new Set(rows.map(a=>a.patientId));el.innerHTML=`<div class="title-row"><div><div class="overline">AGENDA DO CONSULTÓRIO</div><h1 class="title">${dateFmt(selectedDate)}</h1></div><span class="muted">30 min por atendimento</span></div><div class="datebar"><input class="input" id="date" type="date" value="${selectedDate}"><button class="btn" id="today">Hoje</button></div><div class="cards"><div class="stat"><small>ATENDIMENTOS</small><strong>${rows.length}</strong></div><div class="stat"><small>PACIENTES</small><strong>${unique.size}</strong></div><div class="stat"><small>PROFISSIONAIS</small><strong>${new Set(rows.map(a=>a.proId)).size}</strong></div></div><div class="toolbar"><button class="btn primary" id="circuit">✦ Montar circuito</button><button class="btn" id="manual">＋ Atendimento individual</button></div><div class="section-head"><h2>Consultas do dia</h2><span class="muted">${rows.length} registro(s)</span></div>${rows.length?`<div class="list">${rows.map(a=>`<article class="appt"><div class="appt-time">${esc(a.time)}–${esc(add30(a.time))}</div><div><div class="appt-patient">${esc(a.patientName)}</div><div class="appt-prof">${esc(a.proName)}</div></div><span class="appt-status">${esc(a.status||'Agendada')}</span></article>`).join('')}</div>`:`<div class="empty"><strong>Agenda vazia neste dia</strong>Cadastre nomes fictícios e monte um circuito de demonstração.</div>`}<p class="smallnote">O circuito organiza cada paciente com cada profissional, em horários diferentes. A agenda individual também impede conflitos. Horário configurado nesta prévia: 7h a 13h.</p>`;$('#date').onchange=e=>{selectedDate=e.target.value||selectedDate;render()};$('#today').onclick=()=>{selectedDate=new Date().toISOString().slice(0,10);render()};$('#circuit').onclick=showCircuit;$('#manual').onclick=showManual;return}const isP=tab==='patients',list=isP?data.patients:data.pros;el.innerHTML=`<div class="title-row"><div><div class="overline">CADASTRO DO CONSULTÓRIO</div><h1 class="title">${isP?'Pacientes':'Profissionais'}</h1></div><button class="btn primary" id="add">＋ Cadastrar</button></div><p class="muted">Cadastre apenas nomes fictícios nesta prévia. Os nomes são guardados neste navegador.</p>${list.length?list.map(x=>`<div class="manage"><div><b>${esc(x.name)}</b>${x.specialty?`<small>${esc(x.specialty)}</small>`:''}</div><button data-del="${x.id}">Excluir</button></div>`).join(''):`<div class="empty"><strong>Nenhum ${isP?'paciente':'profissional'} cadastrado</strong>A lista começa vazia para você avaliar o fluxo.</div>`}`;$('#add').onclick=()=>showAdd(isP);document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>removeItem(isP,b.dataset.del))}
function add30(t){let [h,m]=t.split(':').map(Number);m+=30;if(m>=60){h++;m-=60}return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')}function minutes(t){let[h,m]=t.split(':').map(Number);return h*60+m}function modal(html){$('#modal').innerHTML=`<div class="modal-back"><section class="modal">${html}</section></div>`;$('.modal-back').onclick=e=>{if(e.target.classList.contains('modal-back'))$('#modal').innerHTML=''};$('#close')?.addEventListener('click',()=>$('#modal').innerHTML='')}
function showAdd(isP){modal(`<h2>${isP?'Novo paciente':'Novo profissional'}</h2><p class="muted">Use um nome fictício para testar.</p><div class="field"><label>Nome</label><input class="input" id="name" placeholder="${isP?'Ex.: Paciente A':'Ex.: Profissional A'}" maxlength="70"></div>${isP?'':'<div class="field"><label>Área ou especialidade (opcional)</label><input class="input" id="spec" placeholder="Ex.: Fisioterapia" maxlength="70"></div>'}<div class="actions"><button class="btn primary" id="save">Salvar</button><button class="btn" id="close">Cancelar</button></div>`);$('#save').onclick=()=>{let name=$('#name').value.trim();if(!name){toast('Digite um nome para continuar.');return}let list=isP?data.patients:data.pros;if(list.some(x=>x.name.toLowerCase()===name.toLowerCase())){toast('Esse nome já foi cadastrado.');return}list.push({id:uid(),name,...(!isP?{specialty:$('#spec').value.trim()}:{})});$('#modal').innerHTML='';save()}}
function removeItem(isP,id){let list=isP?data.patients:data.pros;if(data.appointments.some(a=>(isP?a.patientId:a.proId)===id)){toast('Não dá para excluir um cadastro com atendimentos vinculados.');return}if(confirm('Excluir este cadastro?')){if(isP)data.patients=list.filter(x=>x.id!==id);else data.pros=list.filter(x=>x.id!==id);save()}}
function showCircuit(){if(!data.patients.length||!data.pros.length){toast('Cadastre ao menos um paciente e um profissional fictícios primeiro.');return}let selectedP=new Set(data.patients.map(x=>x.id)),selectedD=new Set(data.pros.map(x=>x.id));modal(`<h2>Montar circuito</h2><p class="muted">Cada paciente passa por todos os profissionais, um de cada vez, em consultas de 30 minutos.</p><div class="field"><label>Data</label><input class="input" id="cdate" type="date" value="${selectedDate}"></div><div class="field"><label>Primeiro horário</label><input class="input" id="start" type="time" value="07:00" step="1800"></div><div class="field"><label>Profissionais incluídos</label><div class="choice-list">${data.pros.map(x=>`<button class="choice selected" data-pro="${x.id}">${esc(x.name)}</button>`).join('')}</div></div><div class="field"><label>Pacientes incluídos</label><div class="choice-list">${data.patients.map(x=>`<button class="choice selected" data-pat="${x.id}">${esc(x.name)}</button>`).join('')}</div></div><div class="actions"><button class="btn primary" id="generate">Gerar agenda</button><button class="btn" id="close">Cancelar</button></div>`);document.querySelectorAll('[data-pro]').forEach(b=>b.onclick=()=>{let id=b.dataset.pro;selectedD.has(id)?selectedD.delete(id):selectedD.add(id);b.classList.toggle('selected')});document.querySelectorAll('[data-pat]').forEach(b=>b.onclick=()=>{let id=b.dataset.pat;selectedP.has(id)?selectedP.delete(id):selectedP.add(id);b.classList.toggle('selected')});$('#generate').onclick=()=>generateCircuit([...selectedP],[...selectedD])}
function generateCircuit(pids,dids){let ps=data.patients.filter(x=>pids.includes(x.id)),ds=data.pros.filter(x=>dids.includes(x.id)),date=$('#cdate').value,start=$('#start').value;if(!ps.length||!ds.length){toast('Escolha pelo menos um paciente e um profissional.');return}if(!date||!/^\d\d:\d\d$/.test(start)||minutes(start)%30!==0){toast('Escolha data e horário em uma grade de 30 minutos, como 07:00.');return}let base=minutes(start),n=ds.length,newRows=[];ps.forEach((p,pi)=>{for(let k=0;k<n;k++){let offset=Math.floor(pi/n)*n+k,t=base+offset*30,d=ds[(pi%n+k)%n];newRows.push({id:uid(),date,patientId:p.id,patientName:p.name,proId:d.id,proName:d.name,time:String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0'),status:'Agendada'})}});let end=Math.max(...newRows.map(a=>minutes(a.time)+30));if(end>13*60){toast(`Não cabe até 13h: terminará às ${String(Math.floor(end/60)).padStart(2,'0')}:${String(end%60).padStart(2,'0')}. Reduza a seleção ou comece antes.`);return}let conflict=newRows.find(s=>data.appointments.some(a=>a.date===date&&a.status!=='Cancelada'&&(a.proId===s.proId||a.patientId===s.patientId)&&minutes(s.time)<minutes(a.time)+30&&minutes(a.time)<minutes(s.time)+30));if(conflict){toast(`Conflito: ${conflict.patientName} ou ${conflict.proName} já tem horário ocupado às ${conflict.time}.`);return}data.appointments.push(...newRows);selectedDate=date;$('#modal').innerHTML='';setTab('agenda');toast(`Circuito criado: ${newRows.length} atendimentos. Termina às ${String(Math.floor(end/60)).padStart(2,'0')}:${String(end%60).padStart(2,'0')}.`)}
function showManual(){if(!data.patients.length||!data.pros.length){toast('Cadastre nomes fictícios de pacientes e profissionais primeiro.');return}modal(`<h2>Novo atendimento</h2><p class="muted">Cada horário dura 30 minutos. O sistema bloqueia sobreposição.</p><div class="field"><label>Data</label><input class="input" id="mdate" type="date" value="${selectedDate}"></div><div class="field"><label>Paciente</label><select id="mp">${data.patients.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`)}</select></div><div class="field"><label>Profissional</label><select id="md">${data.pros.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`)}</select></div><div class="field"><label>Horário entre 7h e 13h</label><input class="input" id="mt" type="time" min="07:00" max="12:30" step="1800" value="09:00"></div><div class="actions"><button class="btn primary" id="save">Salvar atendimento</button><button class="btn" id="close">Cancelar</button></div>`);$('#save').onclick=()=>{let p=data.patients.find(x=>x.id===$('#mp').value),d=data.pros.find(x=>x.id===$('#md').value),date=$('#mdate').value,time=$('#mt').value,t=minutes(time);if(!date||t%30||t<420||t+30>780){toast('Escolha um horário de 30 minutos entre 7h e 13h.');return}let conflict=data.appointments.find(a=>a.date===date&&a.status!=='Cancelada'&&(a.patientId===p.id||a.proId===d.id)&&t<minutes(a.time)+30&&minutes(a.time)<t+30);if(conflict){toast(`${conflict.patientName} ou ${conflict.proName} já está ocupado nesse horário.`);return}data.appointments.push({id:uid(),date,patientId:p.id,patientName:p.name,proId:d.id,proName:d.name,time,status:'Agendada'});selectedDate=date;$('#modal').innerHTML='';save();toast('Atendimento salvo.')}}
render();
</script></body></html>
